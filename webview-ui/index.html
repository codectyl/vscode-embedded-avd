<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-{{nonce}}'; img-src {{cspSource}} https:; script-src 'nonce-{{nonce}}';"
    />
    <link nonce="{{nonce}}" href="{{stylesMainUri}}" rel="stylesheet" />
  </head>
  <body>
     <div id="counterDiv">
      <button id="decrement">-</button>
      <span id="count">0</span>
      <button id="increment">+</button>
    </div>

    <canvas
      id="emulatorCanvas"
      width="720"
      height="1280"
      tabindex="0"
      style="outline: none"
    ></canvas>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
