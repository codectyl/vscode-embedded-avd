<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-{{nonce}}' {{cspSource}}; worker-src blob: {{cspSource}}; img-src {{cspSource}} https: data:; media-src {{cspSource}} blob: https: data:; script-src 'nonce-{{nonce}}'; connect-src ws://127.0.0.1:* {{cspSource}};"
    />
    <link nonce="{{nonce}}" href="{{stylesMainUri}}" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
